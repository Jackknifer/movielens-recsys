[project]
name = "movielens-recsys"
version = "0.1.0"
description = "MovieLens recommendation pipeline with retrieval, ranking, reranking, and evaluation"
readme = "README.md"
license = { text = "CC-BY-NC-SA-4.0" }
requires-python = ">=3.11,<3.12"
dependencies = [
    "numpy>=1.24,<2",
    "pandas==2.0.3",
    "scikit-learn>=1.3.2,<2",
    "pyyaml==6.0.2",
    "tqdm==4.67.1",
    "tensorflow-recommenders==0.7.3",
    "tensorflow-macos==2.15.0; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "tensorflow==2.15.0; sys_platform != 'darwin' or platform_machine != 'arm64'",
]

[dependency-groups]
dev = [
    "pytest>=8,<9",
    "remotezip>=0.12,<0.13",
    "markdown-it-py>=3,<5",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "--basetemp=.work/pytest"
